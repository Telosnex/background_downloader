name: Integration

# Each platform downloads one file from a local HTTP server that the job
# starts (example/tool/download_server.dart on port 8080). The Android
# emulator reaches it at 10.0.2.2; the other platforms at 127.0.0.1.

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVICE: macos
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: example
      - name: Start the download server
        working-directory: example
        run: |
          dart run tool/download_server.dart > "$RUNNER_TEMP/download_server.log" 2>&1 &
          curl --fail --silent --show-error -o /dev/null --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/files/1MB-test.bin
      - name: Download test
        working-directory: example
        run: flutter test integration_test/download_test.dart -d "$DEVICE" -r expanded

  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb xauth
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: example
      - name: Start the download server
        working-directory: example
        run: |
          dart run tool/download_server.dart > "$RUNNER_TEMP/download_server.log" 2>&1 &
          curl --fail --silent --show-error -o /dev/null --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/files/1MB-test.bin
      - name: Download test
        working-directory: example
        run: xvfb-run -a flutter test integration_test/download_test.dart -d linux -r expanded

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DEVICE: windows
    steps: *desktop_steps

  ios:
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: example
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: simulator
      - name: Start the download server
        working-directory: example
        run: |
          dart run tool/download_server.dart > "$RUNNER_TEMP/download_server.log" 2>&1 &
          curl --fail --silent --show-error -o /dev/null --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/files/1MB-test.bin
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          target: integration_test/download_test.dart
          working-directory: example
          udid: ${{ steps.simulator.outputs.udid }}

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: example
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: emulator
      - name: Start the download server
        working-directory: example
        run: |
          dart run tool/download_server.dart > "$RUNNER_TEMP/download_server.log" 2>&1 &
          curl --fail --silent --show-error -o /dev/null --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/files/1MB-test.bin
      - name: Download test
        working-directory: example
        run: flutter test integration_test/download_test.dart -d "${{ steps.emulator.outputs.serial }}" -r expanded
      - name: Upload the emulator logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore
